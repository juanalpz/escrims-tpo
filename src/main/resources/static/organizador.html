<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>eScrims — Organizador</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="top-switcher">
      <div class="brand">eScrims <small>demo</small></div>
      <div class="nav-links">
        <a href="index.html">Jugador · móvil</a>
        <a href="organizador.html" class="active">Organizador · web</a>
      </div>
    </nav>

    <main class="dashboard-container">
      <!-- Columna izquierda: crear scrim (Builder + validaciones DTO) -->
      <section class="panel">
        <div class="panel-head">
          <h2>Crear scrim</h2>
          <span class="ref">ScrimBuilder</span>
        </div>
        <form id="formCrearScrim" class="form" onsubmit="crearScrim(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="juego">Juego</label>
              <select id="juego">
                <option value="VALORANT">Valorant</option>
                <option value="LEAGUE_OF_LEGENDS">League of Legends</option>
                <option value="CS2">Counter-Strike 2</option>
              </select>
            </div>
            <div class="form-group">
              <label for="formato">Formato</label>
              <select id="formato">
                <option value="CINCO_VS_CINCO">5v5 · 10 cupos</option>
                <option value="TRES_VS_TRES">3v3 · 6 cupos</option>
                <option value="UNO_VS_UNO">1v1 · 2 cupos</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="region">Región</label>
              <select id="region">
                <option value="LAS">LAS</option>
                <option value="LAN">LAN</option>
                <option value="BR">BR</option>
              </select>
            </div>
            <div class="form-group">
              <label for="latenciaMax">Latencia máx. (ms)</label>
              <input
                type="number"
                id="latenciaMax"
                value="75"
                min="1"
                max="500"
                required
              />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="rangoMin">Rango mínimo</label>
              <select id="rangoMin">
                <option value="ORO">Oro</option>
                <option value="PLATINO">Platino</option>
                <option value="DIAMANTE">Diamante</option>
              </select>
            </div>
            <div class="form-group">
              <label for="rangoMax">Rango máximo</label>
              <select id="rangoMax">
                <option value="PLATINO">Platino</option>
                <option value="DIAMANTE" selected>Diamante</option>
                <option value="INMORTAL">Inmortal</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="fechaHora">Fecha y hora</label>
            <input type="datetime-local" id="fechaHora" required />
          </div>

          <button type="submit" class="btn-primary">Publicar scrim</button>
        </form>
      </section>

      <!-- Columna derecha: lobby, equipos, suplentes y Command -->
      <section class="panel">
        <div class="panel-head">
          <h2 id="tituloLobby">Valorant 5v5 · LAS</h2>
          <span id="badgeEstadoLobby" class="state state-lobby"
            >Lobby armado</span
          >
        </div>

        <div id="toastOrg" class="toast" role="status"></div>

        <!-- Acciones pre-partida (Patrón Command + Undo) -->
        <div class="command-toolbar">
          <span class="label">Pre-partida <span class="ref">Command</span></span>
          <button class="btn-ghost" onclick="ejecutarSwap()">
            Swap A1 ↔ B1
          </button>
          <button class="btn-ghost" onclick="ejecutarAsignarRol()">
            Cambiar rol A1
          </button>
          <button class="btn-ghost" onclick="deshacerUltimoComando()">
            Deshacer (<span id="contadorUndo">0</span>)
          </button>
          <button class="btn-primary" onclick="iniciarPartida()">
            Iniciar scrim <span class="ref">CU7</span>
          </button>
        </div>

        <div class="teams-grid">
          <div class="team">
            <h3>Equipo A <span class="ref">titulares</span></h3>
            <div id="listaEquipoA"></div>
          </div>
          <div class="team">
            <h3>Equipo B <span class="ref">titulares</span></h3>
            <div id="listaEquipoB"></div>
          </div>
        </div>

        <!-- Lista de espera / suplentes FIFO (RN-10 / RN-17) -->
        <div class="team">
          <h3>Lista de espera <span class="ref">FIFO · RN-17</span></h3>
          <div id="listaSuplentes"></div>
        </div>
      </section>
    </main>

    <script>
      let estadoActual = 'Lobby armado';
      let equipoA = [
        { nombre: 'ViperLAS', rol: 'DUELIST' },
        { nombre: 'Kuro_gg', rol: 'CONTROLLER' },
        { nombre: 'TomiSova', rol: 'INITIATOR' },
      ];
      let equipoB = [
        { nombre: 'NikoValorant', rol: 'DUELIST' },
        { nombre: 'SantiSmoke', rol: 'SENTINEL' },
        { nombre: 'MatiFlex', rol: 'INITIATOR' },
      ];
      let suplentes = [
        { nombre: 'Suplente_01', rol: 'SENTINEL' },
        { nombre: 'Suplente_02', rol: 'CONTROLLER' },
      ];

      const historialComandos = [];

      let timerAviso;
      function notificarOrg(msg, esError = false) {
        const toast = document.getElementById('toastOrg');
        toast.textContent = msg;
        toast.classList.add('is-visible');
        toast.classList.toggle('is-error', esError);
        clearTimeout(timerAviso);
        timerAviso = setTimeout(
          () => toast.classList.remove('is-visible'),
          3500,
        );
      }

      function validarPrePartida() {
        if (estadoActual === 'En juego') {
          notificarOrg(
            'RN-12: No se pueden ejecutar ni deshacer comandos una vez iniciada la partida.',
            true,
          );
          return false;
        }
        return true;
      }

      function ejecutarSwap() {
        if (!validarPrePartida()) return;
        const temp = equipoA[0];
        equipoA[0] = equipoB[0];
        equipoB[0] = temp;

        historialComandos.push({ tipo: 'SWAP' });
        notificarOrg(
          `SwapJugadoresCommand ejecutado: ${equipoB[0].nombre} ↔ ${equipoA[0].nombre}`,
        );
        renderLobby();
      }

      function ejecutarAsignarRol() {
        if (!validarPrePartida()) return;
        const rolAnterior = equipoA[0].rol;
        const nuevoRol = rolAnterior === 'DUELIST' ? 'SENTINEL' : 'DUELIST';
        equipoA[0].rol = nuevoRol;

        historialComandos.push({ tipo: 'ROL', rolAnterior });
        notificarOrg(
          `AsignarRolCommand: ${equipoA[0].nombre} pasó de ${rolAnterior} a ${nuevoRol}`,
        );
        renderLobby();
      }

      function deshacerUltimoComando() {
        if (!validarPrePartida()) return;
        if (historialComandos.length === 0) {
          notificarOrg('No hay comandos en el historial para deshacer.', true);
          return;
        }
        const ultimo = historialComandos.pop();
        if (ultimo.tipo === 'SWAP') {
          const temp = equipoA[0];
          equipoA[0] = equipoB[0];
          equipoB[0] = temp;
          notificarOrg(
            'Undo ejecutado: Se revirtió el intercambio de jugadores.',
          );
        } else if (ultimo.tipo === 'ROL') {
          equipoA[0].rol = ultimo.rolAnterior;
          notificarOrg(
            `Undo ejecutado: Rol restaurado a ${ultimo.rolAnterior}.`,
          );
        }
        renderLobby();
      }

      function bajarTitularYPromover(indice) {
        if (!validarPrePartida()) return;
        const saliente = equipoA[indice];
        if (suplentes.length > 0) {
          const promovido = suplentes.shift();
          equipoA[indice] = promovido;
          notificarOrg(
            `RN-17: ${saliente.nombre} se bajó. Se promovió automáticamente a ${promovido.nombre}.`,
          );
        } else {
          equipoA.splice(indice, 1);
          notificarOrg(`${saliente.nombre} se bajó del equipo.`);
        }
        renderLobby();
      }

      function iniciarPartida() {
        estadoActual = 'En juego';
        const badge = document.getElementById('badgeEstadoLobby');
        badge.textContent = 'En juego';
        badge.className = 'state state-enjuego';
        notificarOrg(
          'CU7: Transición a EnJuegoState completada. Comandos pre-partida bloqueados (RN-12).',
        );
      }

      function crearScrim(e) {
        e.preventDefault();
        const texto = (id) => {
          const sel = document.getElementById(id);
          return sel.options[sel.selectedIndex].text;
        };
        const juego = texto('juego');
        const formato = texto('formato').split(' ')[0];
        const region = document.getElementById('region').value;
        const lat = document.getElementById('latenciaMax').value;

        document.getElementById('tituloLobby').textContent =
          `${juego} ${formato} · ${region} · ≤ ${lat} ms`;
        estadoActual = 'Buscando jugadores';
        const badge = document.getElementById('badgeEstadoLobby');
        badge.textContent = estadoActual;
        badge.className = 'state state-buscando';
        notificarOrg(
          'Scrim creado mediante ScrimBuilder y publicado en DomainEventBus.',
        );
      }

      function renderLobby() {
        document.getElementById('contadorUndo').textContent =
          historialComandos.length;

        document.getElementById('listaEquipoA').innerHTML = equipoA
          .map(
            (j, idx) => `
            <div class="player-row">
              <span class="pos">A${idx + 1}</span>
              <span class="nombre">${j.nombre}</span>
              <span class="rol">${j.rol}</span>
              <button class="btn-danger" onclick="bajarTitularYPromover(${idx})">Bajar</button>
            </div>`,
          )
          .join('');

        document.getElementById('listaEquipoB').innerHTML = equipoB
          .map(
            (j, idx) => `
            <div class="player-row">
              <span class="pos">B${idx + 1}</span>
              <span class="nombre">${j.nombre}</span>
              <span class="rol">${j.rol}</span>
            </div>`,
          )
          .join('');

        document.getElementById('listaSuplentes').innerHTML = suplentes.length
          ? suplentes
              .map(
                (j, idx) => `
                <div class="player-row">
                  <span class="pos">${idx + 1}°</span>
                  <span class="nombre">${j.nombre}</span>
                  <span class="rol">${j.rol}</span>
                </div>`,
              )
              .join('')
          : `<div class="empty">No hay suplentes en espera.</div>`;
      }

      renderLobby();
    </script>
  </body>
</html>
